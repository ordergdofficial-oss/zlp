<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Teletype parodia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!--
  КАК ЗАПУСТИТЬ (GitHub Pages):
  1. Создай публичный репозиторий, залей туда этот index.html и пустой файл .nojekyll
  2. Settings → Pages → Deploy from a branch → main / (root)
  3. Settings (профиль) → Developer settings → Fine-grained tokens → репозиторий: только этот,
     Permissions → Contents: Read and write. Токен НИКОГДА не коммить в репозиторий.
  4. Впиши ниже GH.owner / GH.repo, открой https://ИМЯ.github.io/РЕПО/#new=КЛЮЧ
     и при первой публикации вставь токен (он сохранится только в localStorage твоего браузера).
-->
<style>
  :root{--bg:#0B0B0D;--panel:#141416;--line:#232327;--ink:#F2F2F3;--ink-soft:#8A8A90;--accent:#F2F2F3;}
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{min-height:100vh;font-family:'Inter',sans-serif;color:var(--ink);background:var(--bg);}
  .wrap{max-width:520px;margin:0 auto;}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;position:sticky;top:0;background:var(--bg);z-index:5;}
  .brand{font-weight:800;font-size:16px;letter-spacing:-.01em;}
  .content{padding:24px 18px 100px;}
  input[type=text]{width:100%;border:none;background:transparent;padding:6px 0 14px;font-size:28px;font-family:Georgia,'Times New Roman',serif;color:var(--ink);outline:none;border-bottom:1px solid var(--line);}
  input[type=text]::placeholder{color:#4C4C52;}
  .add-row{display:flex;align-items:center;gap:9px;margin:20px 0 24px;}
  .add-btn{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);color:var(--ink);font-size:15px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:.15s;}
  .add-btn:hover{border-color:#B8B8B8;background:var(--panel);}
  .add-label{font-size:12.5px;color:var(--ink-soft);font-weight:600;}
  .visually-hidden{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0;}
  .shots{display:flex;flex-direction:column;gap:9px;}
  .shot{position:relative;}
  .shot img{width:100%;display:block;border-radius:4px;}
  .shot .rm{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:50%;border:none;background:rgba(0,0,0,.6);color:#fff;font-size:14px;cursor:pointer;}
  .publish-bar{position:fixed;left:0;right:0;bottom:0;padding:14px 18px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 60%,transparent);}
  .publish-inner{max-width:520px;margin:0 auto;}
  .btn{min-width:140px;border:2px solid var(--accent);border-radius:999px;padding:13px 28px;font:700 14px 'Inter',sans-serif;letter-spacing:.02em;color:var(--accent);cursor:pointer;background:transparent;text-transform:uppercase;transition:.15s;}
  .btn:hover{background:var(--accent);color:#0B0B0D;}
  .btn:active{transform:scale(.98);}
  .btn:disabled{opacity:.4;cursor:not-allowed;}
  .share-box{margin-top:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;gap:8px;align-items:center;}
  .share-box input{flex:1;font-size:12px;font-family:'Inter',sans-serif;color:var(--ink-soft);font-weight:600;padding:0;border-bottom:none;}
  .copy-btn{border:none;border-radius:999px;background:var(--accent);color:#0B0B0D;font-weight:700;padding:8px 14px;font-size:12px;cursor:pointer;white-space:nowrap;}
  .author-row{display:flex;align-items:center;gap:11px;padding:24px 18px 0;}
  .author-avatar{width:42px;height:42px;border-radius:50%;background:var(--panel);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;}
  .author-name{font-weight:800;font-size:15px;line-height:1.3;}
  .author-date,.post-meta-top{font-size:12.5px;color:var(--ink-soft);font-weight:600;}
  .post-meta-top{padding:24px 18px 0;}
  .post-title{font-size:32px;font-weight:800;letter-spacing:-.01em;padding:20px 18px;}
  .gallery{display:flex;flex-direction:column;gap:28px;padding:0 18px 60px;}
  .gallery img{width:100%;display:block;border-radius:4px;}
  .empty-shots{margin:0 18px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;text-align:center;color:var(--ink-soft);font-weight:600;font-size:13px;}
  .state-box{text-align:center;padding:60px 18px;color:var(--ink-soft);font-weight:600;}
  .spinner{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--ink);margin:0 auto 14px;animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#1A1A1A;color:#fff;font-weight:600;font-size:13px;padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:.25s;z-index:50;}
  .toast.show{opacity:1;}
</style>
</head>
<body>
<div class="wrap" id="root"></div>
<div class="toast" id="toast"></div>

<script>
// ---------- Настройки ----------
const GH = { owner: 'YOUR_GITHUB_USERNAME', repo: 'YOUR_REPO_NAME', branch: 'main' };
const CREATE_KEY = 'vacu-x7q2m9k4';   // ссылка создания: index.html#new=vacu-x7q2m9k4
const AUTHOR_NAME = '';               // '' — блок с автором скрыт
const MAX_IMAGES = 60;
const MAX_W = 1600, JPEG_Q = 0.9;

const root = document.getElementById('root');
const toastEl = document.getElementById('toast');
let images = [];          // [{blob, url}]
let isPublishing = false;

function showToast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  setTimeout(()=>toastEl.classList.remove('show'), 2200);
}
function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
function genId(){ return Math.random().toString(36).slice(2,8) + Date.now().toString(36).slice(-4); }

// Сжатие в JPEG (лимитов Firestore больше нет, поэтому качество выше)
function fileToJpegBlob(file){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    const src = URL.createObjectURL(file);
    img.onload = ()=>{
      let w = img.width, h = img.height;
      if(w > MAX_W){ h = Math.round(h * MAX_W / w); w = MAX_W; }
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(src);
      c.toBlob(b => b ? resolve(b) : reject(new Error('toBlob')), 'image/jpeg', JPEG_Q);
    };
    img.onerror = reject;
    img.src = src;
  });
}
const blobToB64 = b => new Promise((res, rej)=>{
  const r = new FileReader();
  r.onload = () => res(r.result.split(',')[1]);
  r.onerror = rej;
  r.readAsDataURL(b);
});

// ---------- GitHub API ----------
async function gh(token, path, method='GET', body){
  const r = await fetch(`https://api.github.com/repos/${GH.owner}/${GH.repo}/${path}`, {
    method,
    headers: {
      Authorization: 'Bearer ' + token,
      Accept: 'application/vnd.github+json',
      'Content-Type': 'application/json'
    },
    body: body ? JSON.stringify(body) : undefined
  });
  if(r.status === 401){ localStorage.removeItem('gh_token'); throw new Error('Токен не подошёл — введи заново'); }
  if(!r.ok) throw new Error(r.status + ' ' + (await r.text()));
  return r.json();
}

// ---------- Экраны ----------
function renderLocked(){
  root.innerHTML = `<div class="topbar"><div class="brand">Teletype parodia</div></div>
    <div class="state-box">Нет доступа к созданию постов</div>`;
}

function renderCreate(){
  root.innerHTML = `
    <div class="topbar"><div class="brand">Teletype parodia</div></div>
    <div class="content">
      <input type="text" id="titleInput" placeholder="Название игры" maxlength="80">
      <div class="add-row">
        <label class="add-btn" for="fileInput">+</label>
        <div class="add-label">Добавить скрины из галереи</div>
      </div>
      <input type="file" id="fileInput" class="visually-hidden" accept="image/*" multiple>
      <div class="shots" id="shots"></div>
      <div id="resultBox"></div>
    </div>
    <div class="publish-bar"><div class="publish-inner">
      <button class="btn" id="publishBtn">Опубликовать</button>
    </div></div>`;

  const fileInput = document.getElementById('fileInput');
  fileInput.onchange = async (e)=>{
    const room = MAX_IMAGES - images.length;
    if(room <= 0){ showToast(`Максимум ${MAX_IMAGES} скринов`); fileInput.value=''; return; }
    for(const f of Array.from(e.target.files || []).slice(0, room)){
      try{
        const blob = await fileToJpegBlob(f);
        images.push({ blob, url: URL.createObjectURL(blob) });
        renderShots();
      }catch(err){ console.error(err); }
    }
    fileInput.value = '';
  };
  document.getElementById('publishBtn').onclick = handlePublish;
  renderShots();
}

function renderShots(){
  const shots = document.getElementById('shots');
  if(!shots) return;
  shots.innerHTML = images.map((im, i)=>`
    <div class="shot"><img src="${im.url}"><button class="rm" data-i="${i}">✕</button></div>`).join('');
  shots.querySelectorAll('.rm').forEach(b=>{
    b.onclick = ()=>{
      const [x] = images.splice(Number(b.dataset.i), 1);
      URL.revokeObjectURL(x.url);
      renderShots();
    };
  });
}

async function handlePublish(){
  const titleInput = document.getElementById('titleInput');
  const title = titleInput.value.trim();
  const btn = document.getElementById('publishBtn');
  if(!title){ showToast('Введи название игры'); titleInput.focus(); return; }
  if(isPublishing) return;

  let token = localStorage.getItem('gh_token');
  if(!token){
    token = (prompt('Вставь GitHub-токен (fine-grained, Contents: Read and write):') || '').trim();
    if(!token) return;
    localStorage.setItem('gh_token', token);
  }

  isPublishing = true;
  btn.disabled = true;
  btn.textContent = 'Публикуем...';

  try{
    const id = genId();
    const names = images.map((_, i)=> String(i + 1).padStart(3, '0') + '.jpg');

    // 1. Текущий коммит ветки и его дерево
    const ref = await gh(token, `git/ref/heads/${GH.branch}`);
    const parentSha = ref.object.sha;
    const parent = await gh(token, `git/commits/${parentSha}`);

    // 2. Блобы: картинки (по 4 параллельно) + meta.json
    const tree = [];
    for(let i = 0; i < images.length; i += 4){
      const part = await Promise.all(images.slice(i, i + 4).map(async (im, k)=>{
        const b = await gh(token, 'git/blobs', 'POST', { content: await blobToB64(im.blob), encoding: 'base64' });
        return { path: `posts/${id}/${names[i + k]}`, mode: '100644', type: 'blob', sha: b.sha };
      }));
      tree.push(...part);
      btn.textContent = `Загрузка ${Math.min(i + 4, images.length)}/${images.length}`;
    }
    const meta = { title, createdAt: Date.now(), images: names };
    const mb = await gh(token, 'git/blobs', 'POST', { content: JSON.stringify(meta), encoding: 'utf-8' });
    tree.push({ path: `posts/${id}/meta.json`, mode: '100644', type: 'blob', sha: mb.sha });

    // 3. Дерево → коммит → сдвигаем ветку (один коммит на весь пост)
    const newTree = await gh(token, 'git/trees', 'POST', { base_tree: parent.tree.sha, tree });
    const commit = await gh(token, 'git/commits', 'POST', {
      message: `post ${id}: ${title}`, tree: newTree.sha, parents: [parentSha]
    });
    await gh(token, `git/refs/heads/${GH.branch}`, 'PATCH', { sha: commit.sha });

    const link = location.origin + location.pathname + '#p=' + id;
    document.getElementById('resultBox').innerHTML = `
      <div class="share-box">
        <input type="text" id="linkOut" readonly value="${escapeHtml(link)}">
        <button class="copy-btn" id="copyBtn">Копировать</button>
      </div>`;
    document.getElementById('copyBtn').onclick = ()=>{
      document.getElementById('linkOut').select();
      navigator.clipboard?.writeText(link).catch(()=>{});
      showToast('Ссылка скопирована');
    };
    showToast('Опубликовано');
  }catch(err){
    console.error(err);
    showToast(String(err.message || 'Не получилось опубликовать').slice(0, 80));
  }finally{
    isPublishing = false;
    btn.disabled = false;
    btn.textContent = 'Опубликовать';
  }
}

// Сначала сам сайт (Pages), если файла ещё нет (деплой 1–2 мин) — raw.githubusercontent.com
async function loadPost(id){
  const bases = [
    `posts/${id}/`,
    `https://raw.githubusercontent.com/${GH.owner}/${GH.repo}/${GH.branch}/posts/${id}/`
  ];
  for(const base of bases){
    try{
      const r = await fetch(base + 'meta.json', { cache: 'no-store' });
      if(r.ok) return { base, post: await r.json() };
    }catch(e){}
  }
  return null;
}

async function renderView(id, attempt = 0){
  if(attempt === 0){
    root.innerHTML = `<div class="topbar"><div class="brand">Teletype parodia</div></div>
      <div class="state-box"><div class="spinner"></div><span id="stateMsg">Загрузка...</span></div>`;
  }
  const res = await loadPost(id);
  if(!res){
    const msg = document.getElementById('stateMsg');
    if(attempt < 12 && msg){
      msg.textContent = 'Пост ещё публикуется, подождите...';
      setTimeout(()=>{ if(location.hash.includes(id)) renderView(id, attempt + 1); }, 8000);
    }else if(msg){
      document.querySelector('.state-box').innerHTML = 'Пост не найден';
    }
    return;
  }
  const { base, post } = res;
  const dateStr = new Date(post.createdAt).toLocaleDateString('ru-RU', { day:'numeric', month:'long', year:'numeric' });
  root.innerHTML = `
    <div class="topbar"><div class="brand">Teletype parodia</div></div>
    ${AUTHOR_NAME
      ? `<div class="author-row">
           <div class="author-avatar">${escapeHtml(AUTHOR_NAME.slice(0,1).toUpperCase())}</div>
           <div><div class="author-name">${escapeHtml(AUTHOR_NAME)}</div><div class="author-date">${dateStr}</div></div>
         </div>`
      : `<div class="post-meta-top">${dateStr}</div>`}
    <div class="post-title">${escapeHtml(post.title)}</div>
    ${post.images.length
      ? `<div class="gallery">${post.images.map(n=>`<img loading="lazy" src="${base + n}">`).join('')}</div>`
      : `<div class="empty-shots">Скриншотов нет</div>`}`;
}

function route(){
  const hash = location.hash || '';
  const v = hash.match(/p=([a-z0-9]+)/i);
  if(v){ renderView(v[1]); return; }
  const n = hash.match(/new=([^&]+)/);
  if(n && decodeURIComponent(n[1]) === CREATE_KEY){ renderCreate(); return; }
  renderLocked();
}
window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
